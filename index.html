<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMCP - Financial Model Context Protocol</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 0 20px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }
        .cta {
            display: inline-block;
            padding: 12px 24px;
            background-color: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .cta:hover {
            opacity: 0.9;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FMCP: The Standard Protocol for Autonomous Financial Agents</h1>
        <p class="subtitle">Bridging AI and finance through standardized semantics, enabling self-sustaining financial agents</p>
    </div>
</body>
</html>
